name: Probe data sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe.py
      - run: |
          git config user.name "haze-updater"
          git config user.email "haze-updater@users.noreply.github.com"
          git add probe.json
          git commit -m "Probe results [skip ci]"
          git push
